services:
  scum-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: local/scum-server:latest
    container_name: scum-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      UPDATE_ON_START: ${UPDATE_ON_START:-true}
      VALIDATE_ON_UPDATE: ${VALIDATE_ON_UPDATE:-false}
      SERVER_NAME: ${SERVER_NAME:-SCUM Docker Server}
      SERVER_DESCRIPTION: ${SERVER_DESCRIPTION:-Managed with Docker Compose}
      SERVER_PASSWORD: ${SERVER_PASSWORD:-}
      MAX_PLAYERS: ${MAX_PLAYERS:-32}
      SERVER_PLAYSTYLE: ${SERVER_PLAYSTYLE:-PVP}
      GAME_PORT: ${GAME_PORT:-7777}
      QUERY_PORT: ${QUERY_PORT:-27015}
      # Leave empty under bridge networking unless a valid container-side IP is known.
      MULTIHOME_IP: ${MULTIHOME_IP:-}
      RCON_ENABLED: ${RCON_ENABLED:-1}
      RCON_PORT: ${RCON_PORT:-$GAME_PORT_PLUS_2}
      RCON_PASSWORD: ${RCON_PASSWORD:-}
      ADDITIONAL_FLAGS: ${ADDITIONAL_FLAGS:--nobattleye}
      DEPOT_MAX_DOWNLOADS: ${DEPOT_MAX_DOWNLOADS:-8}
      LOG_WEBHOOK_URL: ${LOG_WEBHOOK_URL:-}
    # Explicit host-IP mappings: BIND_IP is the VPS game IP, not the Docker
    # network address. Expose both protocols to match real-world SCUM hosting.
    ports:
      - "${BIND_IP:?Set BIND_IP in .env}:${GAME_PORT:-7777}:${GAME_PORT:-7777}/udp"
      - "${BIND_IP:?Set BIND_IP in .env}:${GAME_PORT:-7777}:${GAME_PORT:-7777}/tcp"
      - "${BIND_IP:?Set BIND_IP in .env}:${GAME_PORT_PLUS_1:-7778}:${GAME_PORT_PLUS_1:-7778}/udp"
      - "${BIND_IP:?Set BIND_IP in .env}:${GAME_PORT_PLUS_1:-7778}:${GAME_PORT_PLUS_1:-7778}/tcp"
      - "${BIND_IP:?Set BIND_IP in .env}:${GAME_PORT_PLUS_2:-7779}:${GAME_PORT_PLUS_2:-7779}/udp"
      - "${BIND_IP:?Set BIND_IP in .env}:${GAME_PORT_PLUS_2:-7779}:${GAME_PORT_PLUS_2:-7779}/tcp"
      - "${BIND_IP:?Set BIND_IP in .env}:${QUERY_PORT:-27015}:${QUERY_PORT:-27015}/udp"
      - "${BIND_IP:?Set BIND_IP in .env}:${QUERY_PORT:-27015}:${QUERY_PORT:-27015}/tcp"
    volumes:
      - ./data:/data
    user: "0:0"
    stop_grace_period: 90s
    networks:
      - scum_network

networks:
  scum_network:
    name: ${COMPOSE_PROJECT_NAME:-scum}_network
    driver: bridge
